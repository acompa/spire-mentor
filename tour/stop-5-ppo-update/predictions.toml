# Stop 5: the PPO update. Fill in guess, low and high for each entry
# (low <= guess <= high, an 80% interval). The check refuses to run while any
# value is blank. "Clipped arm" is the learning check as the learner runs it;
# "unclipped arm" removes the clip and takes bigger steps (see the README).

[floor_start]
question = "Mean floor reached by the first runs of the clipped arm (the learning check's first window), from random weights"
unit = "floor"
guess = ""
low = ""
high = ""

[floor_end]
question = "Mean floor reached by the last runs of the clipped arm (the learning check's last window)"
unit = "floor"
guess = ""
