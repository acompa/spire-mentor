# Rough sample values for dry runs (TOUR_DEV=1). Not answers.

[ci_half_width]
question = "Half-width of the 95% Wilson interval on the Ironclad network's pooled win rate, at the default 400 seeds"
unit = "percentage points"
guess = 5
low = 2
high = 10

[discordant_seeds]
question = "Seeds, of the default 400, that exactly one of the two networks wins"
unit = "seeds"
guess = 60
low = 20
high = 140

[win_rate_difference]
question = "Ironclad network's win rate minus the all-character network's, pooled"
unit = "percentage points"
guess = 5
low = -5
high = 15

[slice_spread]
question = "Highest minus lowest win rate of the Ironclad network across its four 100-seed slices"
unit = "percentage points"
guess = 6
low = 2
high = 15

[mde_at_1000]
question = "Smallest true difference 1,000 paired seeds detect with 80% power (two-sided 5%), at the measured discordance"
unit = "percentage points"
guess = 3
low = 1
high = 6

[hours_for_4000]
question = "Hours to play 4,000 paired seeds with both networks on this Mac, at the measured throughput"
unit = "hours"
guess = 2
low = 1
high = 5
