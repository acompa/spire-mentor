# Rough sample values for dry runs (TOUR_DEV=1). Not answers: they are
# deliberately loose guesses, not measurements.
# Returns are in reward units: a win alone is worth 1.0.

[won_run_return]
question = "The return of a run the network wins (the median over its wins)"
unit = "reward"
guess = 1.5
low = 1.0
high = 2.0

